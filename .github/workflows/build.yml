name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon --stacktrace assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tridekeract-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tridekeract-${{ github.run_number }}
          path: Tridekeract-${{ github.run_number }}.apk
      - name: Publish as a release (download this on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tridekeract build ${{ github.run_number }}
          body: Install Tridekeract-${{ github.run_number }}.apk on your Android phone.
          files: Tridekeract-${{ github.run_number }}.apk
          make_latest: true
